name: Validate CITATION.cff

on:
  push:
    branches: [main]
    paths:
      - "CITATION.cff"
      - ".github/workflows/citation.yml"
  pull_request:
    paths:
      - "CITATION.cff"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Citation File Format
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"
